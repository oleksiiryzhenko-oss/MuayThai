workflows:
  win2day-muaythai-android:
    name: Win2day — Release APK + AAB
    instance_type: mac_mini_m2
    max_build_duration: 90
    environment:
      java: 17
      android_signing:
        - MuayThai
      vars:
        APPSFLYER_DEV_KEY: "oGFCBcDPKreTBoQgRTzucF"
        AF_HANDOFF_CONFIG_KEY: "p9d6c24a81f037be5a602"
    scripts:
      - name: Configure Android SDK
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"
      - name: Verify and build signed APK and AAB
        script: |
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest :app:lintRelease :app:assembleRelease :app:bundleRelease --console=plain
    artifacts:
      - app/build/outputs/apk/release/*.apk
      - app/build/outputs/bundle/release/*.aab
      - app/build/outputs/mapping/release/mapping.txt
